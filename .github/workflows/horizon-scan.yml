name: Horizon scan (two 30-day blocks, 3 and 5 months out)

# Scans two contiguous 30-day blocks (days 90-119 and 150-179) in full, well
# beyond the daily window, because that window sits on the wrong part of the
# booking curve: our own history shows fares inside 5
# days running ~8% above a route's median and fares 21-25 days out ~6% below,
# with no sign of a bottom by day 30. Southeast Asia is repeatedly measured to
# bottom at 3-6 months, and AirAsia's sale campaigns sell travel 6-12 months
# ahead — none of which the daily scan can see.
#
# A SEPARATE workflow on purpose. The daily digest is currently competing for a
# throttled request budget (coverage fell to 67% in mid-August), and a second
# lane sharing that budget would degrade the thing that actually gets read. Run
# here, a throttled horizon scan costs nothing but its own results.
#
# Blocks rather than a sparse sample: taking 10 of 30 dates misses the true
# cheapest fare 41% of the time and reads a mean 13.9% high on our own data,
# which is the same size as the discount it was meant to detect. Both blocks
# are compared min-to-min against the near window, and only when both sides
# are at least 80% covered — at 50% coverage a window's minimum reads ~12%
# high, enough to invent a bargain out of measurement alone.
#
# ENABLED 26 Aug. It was held back while the provider was returning empty
# results — adding ~1,560 searches a week to a throttled budget would have
# degraded the daily digest, which is the thing that actually gets read. The
# condition set at the time was coverage above 80% for three consecutive days;
# it has now run six: 84, 86, 91, 86, 97, 96%.
#
# If coverage slides below the floor again, comment the schedule back out. The
# daily digest is the priority; this lane is an extra.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scan and print, without writing the store"
        type: boolean
        default: false
  schedule:
    - cron: "0 5 * * 0"      # Sundays, well clear of the daily digest

permissions:
  contents: write

concurrency:
  group: horizon-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Scan the horizon (shard ${{ matrix.shard }})
        env:
          PROVIDER: googleflights
          CURRENCY: ${{ vars.CURRENCY || 'MYR' }}
          REGION: ${{ vars.REGION || 'my' }}
          LANGUAGE: ${{ vars.LANGUAGE || 'en' }}
          ROUTES: ${{ vars.ROUTES }}
          HORIZON_BLOCK_STARTS: ${{ vars.HORIZON_BLOCK_STARTS }}
          HORIZON_BLOCK_DAYS: ${{ vars.HORIZON_BLOCK_DAYS }}
          HORIZON_PATH: horizon-${{ matrix.shard }}.json
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: >
          python scripts/horizon_scan.py
          --shard ${{ matrix.shard }} --shards 4
          ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.dry_run != 'true' }}
        with:
          name: horizon-${{ matrix.shard }}
          path: horizon-${{ matrix.shard }}.json
          if-no-files-found: warn

  merge:
    needs: scan
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: horizon-*
          path: shards
          merge-multiple: true

      - name: Merge shards into the horizon store
        run: |
          python - <<'PY'
          import glob, json
          from datetime import datetime, timezone
          from flightdeals.horizon import load_horizon, prune, save_horizon

          store = load_horizon("data/horizon_prices.json")
          for path in sorted(glob.glob("shards/*.json")):
              for key, by_day in load_horizon(path).items():
                  bucket = store.setdefault(key, {})
                  for day, price in by_day.items():
                      # Cheapest wins, same rule the daily lane uses, so two
                      # shards disagreeing never inflates a stored price.
                      if day not in bucket or price < bucket[day]:
                          bucket[day] = price
          store = prune(store, datetime.now(timezone.utc).date())
          save_horizon("data/horizon_prices.json", store)
          print(f"merged -> {len(store)} series")
          PY

      - name: Commit the horizon store
        run: |
          git config user.name "flight-deals-bot"
          git config user.email "actions@github.com"
          git add data/horizon_prices.json
          if git diff --staged --quiet; then
            echo "No horizon changes to commit."
          else
            git commit -m "chore: update horizon prices [skip ci]"
            for i in 1 2 3 4; do
              if git push; then break; fi
              echo "push failed, retrying in $((2**i))s"; sleep $((2**i))
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
            done
          fi
