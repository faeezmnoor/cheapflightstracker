name: Probe Indonesian destinations

# One-off helper: checks which Indonesian airports are actually reachable from
# KL and whether they need a connection. Run it by hand when deciding which
# routes to scan daily — it does not email anything or touch price history.
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "Space-separated IATA codes to probe (blank = all candidates)"
        type: string
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe destinations
        env:
          PROVIDER: googleflights
          CURRENCY: MYR
          REGION: my
          LANGUAGE: en
        run: python scripts/probe_destinations.py ${{ github.event.inputs.codes }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: probe_results.json
          if-no-files-found: ignore
